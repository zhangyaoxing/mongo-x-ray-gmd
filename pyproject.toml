[build-system]
requires = ["setuptools==83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mongo-x-ray-gmd"
version = "1.5.3"
description = "getMongoData analysis plugin for x-ray"
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
  "mongo-x-ray>=1.5.3",
  "mongo-x-ray-hc>=1.5.3",
]

[project.entry-points."x_ray.plugins"]
gmd = "mongo_x_ray_gmd.plugin:GmdPlugin"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mongo_x_ray_gmd*"]

[tool.setuptools.package-data]
"mongo_x_ray_gmd" = ["templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
  "slow: marks tests as slow",
  "integration: marks tests as integration tests",
  "unit: marks tests as unit tests",
]


[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

